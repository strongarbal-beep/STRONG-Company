<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C06E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997C22" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(15, 10)">
    <!-- Hexagon shield base -->
    <polygon points="50,5 92,27 92,73 50,95 8,73 8,27" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
    <!-- Inner stylized S geometric -->
    <path d="M68,32 L36,32 C31,32 28,35 28,40 L28,48 C28,53 32,56 38,57 L62,60 C68,61 72,65 72,70 L72,78 C72,83 68,86 62,86 L30,86" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Small accent diamond -->
    <polygon points="50,15 54,21 50,27 46,21" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <!-- Latin / Main Brand -->
  <text x="130" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="38" letter-spacing="4" fill="#0F172A">STRONG</text>
  <text x="315" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" font-size="28" letter-spacing="6" fill="#D4AF37">COMPANY</text>
  
  <!-- Subtitle in Arabic & Kurdish Sorani -->
  <text x="132" y="86" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="600" font-size="13" letter-spacing="1.5" fill="#475569">شركة سترونغ • کۆمپانیای سترۆنگ • ERBIL - IRAQ</text>
  <line x1="130" y1="96" x2="480" y2="96" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
