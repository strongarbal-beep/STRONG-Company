<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="50%" stop-color="#0F1E36"/>
      <stop offset="100%" stop-color="#030811"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E8CE9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Architectural geometric polygons -->
  <polygon points="900,-100 1700,-50 1500,950 750,900" fill="url(#cyanAccent)"/>
  <polygon points="1100,50 1650,300 1350,950 850,700" fill="url(#goldBeam)"/>

  <!-- Accent Lines -->
  <line x1="850" y1="0" x2="1550" y2="900" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 8"/>
  <line x1="600" y1="200" x2="1400" y2="900" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.25"/>
  <line x1="300" y1="850" x2="1100" y2="850" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Glowing focal points -->
  <circle cx="1200" cy="350" r="280" fill="#0E8CE9" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="950" cy="650" r="200" fill="#D4AF37" fill-opacity="0.08" filter="blur(50px)"/>

  <!-- Subtle abstract 3D structure representation -->
  <g transform="translate(1050, 250)" stroke="#E2E8F0" stroke-opacity="0.15" stroke-width="2" fill="none">
    <polygon points="120,40 240,110 240,250 120,180"/>
    <polygon points="0,110 120,40 120,180 0,250"/>
    <polygon points="0,110 120,40 240,110 120,180" fill="#38BDF8" fill-opacity="0.05"/>
    <polygon points="120,180 240,250 120,320 0,250"/>
    <polygon points="240,110 360,180 360,320 240,250" fill="#D4AF37" fill-opacity="0.06"/>
  </g>
</svg>
