<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad_ST-G301" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="boxGrad_ST-G301" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="pShadow_ST-G301" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="#0F172A"/>
  <rect width="600" height="600" fill="url(#pGrad_ST-G301)" fill-opacity="0.15"/>

  <!-- Grid accent -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
  </g>

  <!-- Category & Badge -->
  <rect x="40" y="40" width="160" height="34" rx="17" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="120" y="62" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#10B981" text-anchor="middle" letter-spacing="1.5">CATEGORY 3</text>

  <rect x="440" y="40" width="120" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="500" y="62" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">ST-G301</text>

  <!-- Product 3D Container Illustration -->
  <g transform="translate(300, 270)" filter="url(#pShadow_ST-G301)">
    <!-- Isometric Cube / Unit Representation -->
    <!-- Top Face -->
    <polygon points="0,-100 120,-30 0,40 -120,-30" fill="#10B981" fill-opacity="0.8"/>
    <!-- Left Face -->
    <polygon points="-120,-30 0,40 0,160 -120,90" fill="#064E3B" fill-opacity="0.95"/>
    <!-- Right Face -->
    <polygon points="0,40 120,-30 120,90 0,160" fill="#064E3B" fill-opacity="0.7"/>

    <!-- Subtle Technical Lines -->
    <line x1="0" y1="-100" x2="0" y2="40" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="0" cy="-30" r="28" fill="#ffffff" fill-opacity="0.15"/>
    <text x="0" y="-23" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">STRONG</text>
  </g>

  <!-- Product Info Card Bottom -->
  <rect x="40" y="460" width="520" height="100" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="498" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#F8FAFC">Precision Solution Gamma 301</text>
  <text x="65" y="525" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="400" font-size="14" fill="#94A3B8">STRONG Company Official Catalog • نموذج منتج قابل للتعديل والإدارة</text>
  <text x="65" y="546" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="400" font-size="12" fill="#64748B">بەشی فەرمی بەرھەمەکان • Ready for custom image upload via Admin</text>
  
  <!-- Status pill -->
  <circle cx="525" cy="510" r="6" fill="#10B981"/>
</svg>