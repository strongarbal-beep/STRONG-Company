<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#avatarBg)"/>

  <!-- Decorative Rings -->
  <circle cx="300" cy="270" r="180" fill="none" stroke="url(#goldRing)" stroke-width="4" stroke-dasharray="10 6"/>
  <circle cx="300" cy="270" r="160" fill="#1E293B" stroke="#334155" stroke-width="2"/>

  <!-- Executive Silhouette / Avatar Icon -->
  <g fill="#94A3B8" transform="translate(300, 270)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="48" fill="#CBD5E1"/>
    <!-- Shoulders & Suit -->
    <path d="M-85,85 C-85,25 -50,10 0,10 C50,10 85,25 85,85 Z" fill="#0B192C"/>
    <!-- Tie and Shirt Collar -->
    <polygon points="-25,12 0,40 25,12 0,16" fill="#F8FAFC"/>
    <polygon points="-6,25 6,25 10,75 0,90 -10,75" fill="url(#goldRing)"/>
  </g>

  <!-- Name & Title Plate -->
  <rect x="50" y="470" width="500" height="95" rx="12" fill="#0B192C" fill-opacity="0.95" stroke="url(#goldRing)" stroke-width="1.5"/>
  <text x="300" y="508" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC" text-anchor="middle">
    عادل عبد الرحمن كريم
  </text>
  <text x="300" y="534" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="600" font-size="14" fill="#D4AF37" text-anchor="middle">
    Adil Abdulrahman Karim • المدير المفوض • بەڕێوەبەری ڕێپێدراو
  </text>
  <text x="300" y="554" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="12" fill="#94A3B8" text-anchor="middle">
    Authorized Director — STRONG Company
  </text>
</svg>
