<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STRONG Company</title>
  <link rel="canonical" href="ar/">
  <noscript><meta http-equiv="refresh" content="0; url=ar/"></noscript>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #020617; color: #e2e8f0; font-family: system-ui, Arial, sans-serif; }
    a { color: #fbbf24; text-decoration: none; margin: 0 .6rem; font-weight: 700; }
  </style>
  <script>
    (function () {
      // Arabic is the default language; a saved language preference wins.
      var target = 'ar/';
      try {
        var m = document.cookie.match(/(?:^|;\s*)strong_pref_lang=(ar|ku|en)/);
        if (m) target = m[1] + '/';
      } catch (e) {}
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p><a href="ar/">العربية</a> <a href="ku/">کوردی</a> <a href="en/">English</a></p>
</body>
</html>
